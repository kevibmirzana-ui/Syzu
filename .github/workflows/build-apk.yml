name: Build Syzu APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates and folders
        run: |
          mkdir -p build ~/.config/godot ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          ls "$SDK/build-tools" "$SDK/platforms" || true
          SDKM=$(command -v sdkmanager || find / -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" || true
          ls "$SDK/build-tools" "$SDK/platforms" || true
          echo "ANDROID_SDK_PATH=$SDK" >> $GITHUB_ENV
      - name: Editor settings
        run: |
          JAVA="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(command -v javac))))}"
          echo "JAVA=$JAVA"
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Import and export APK
        run: |
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" build/syzu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: syzu-apk
          path: build/syzu.apk
