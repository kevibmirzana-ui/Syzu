name: Build Syzu APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates and folders
        run: |
          mkdir -p build ~/.config/godot ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          echo "== templates =="
          ls ~/.local/share/godot/export_templates/* | head -30
      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "SDK=$SDK"
          SDKM=$(command -v sdkmanager || find / -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" || true
          echo "== sdk =="
          ls "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools" | head -60
          echo "ANDROID_SDK_PATH=$SDK" >> $GITHUB_ENV
      - name: Editor settings
        run: |
          JAVA="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(command -v javac))))}"
          echo "JAVA=$JAVA"
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
      - name: Patch project files
        run: |
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          cat > export_presets.cfg << EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/syzu.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$PWD/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="0.1"
          package/unique_name="com.syzu.game"
          package/name="Syzu"
          package/signed=true
          screen/immersive_mode=true
          EOF
          cat project.godot
      - name: Apply version.env
        run: |
          . ./version.env
          sed -i "s|^version/code=.*|version/code=$VERSION_CODE|; s|^version/name=.*|version/name=\"$VERSION_NAME\"|; s|^package/unique_name=.*|package/unique_name=\"$APP_ID\"|; s|^package/name=.*|package/name=\"$APP_NAME\"|" export_presets.cfg
          cat export_presets.cfg      
      - name: Import and export APK
        run: |
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" build/syzu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: syzu-apk
          path: build/syzu.apk
